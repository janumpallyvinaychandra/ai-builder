<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VINAY AI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #050816;
    --sidebar: #080d1d;
    --panel: #10172b;
    --border: rgba(0, 229, 255, 0.16);
    --cyan: #00e5ff;
    --purple: #7c3aed;
    --text: #626a88;
    --muted: #8e9ab5;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 20% 10%, rgba(0,229,255,.09), transparent 28%),
        radial-gradient(circle at 90% 90%, rgba(124,58,237,.14), transparent 30%),
        var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 280px;
    min-width: 280px;
    background: rgba(8, 13, 29, .96);
    border-right: 1px solid var(--border);
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
}

.logo {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    font-weight: bold;
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    box-shadow: 0 0 30px rgba(0, 229, 255, .25);
}

.brand h1 {
    font-size: 20px;
    letter-spacing: 2px;
}

.brand p {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-top: 5px;
}

.new-chat {
    border: 1px solid rgba(0, 229, 255, .28);
    background: linear-gradient(
        135deg,
        rgba(0, 229, 255, .12),
        rgba(124, 58, 237, .12)
    );
    color: white;
    padding: 14px;
    border-radius: 13px;
    cursor: pointer;
    font-size: 15px;
    margin-bottom: 20px;
}

.new-chat:hover {
    box-shadow: 0 0 22px rgba(0, 229, 255, .18);
}

.history {
    flex: 1;
    overflow-y: auto;
}

.history-item {
    padding: 12px;
    margin-bottom: 7px;
    border-radius: 10px;
    cursor: pointer;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.history-item:hover,
.history-item.active {
    background: rgba(0, 229, 255, .08);
    color: var(--cyan);
}

.sidebar-footer {
    border-top: 1px solid var(--border);
    padding-top: 15px;
    color: #48f593;
    font-size: 11px;
}

.dot {
    width: 8px;
    height: 8px;
    display: inline-block;
    background: #48f593;
    border-radius: 50%;
    box-shadow: 0 0 10px #48f593;
    margin-right: 7px;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    height: 72px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 28px;
    justify-content: space-between;
    background: rgba(5, 8, 22, .65);
    backdrop-filter: blur(15px);
}

.topbar h2 {
    font-size: 17px;
}

.topbar p {
    font-size: 10px;
    color: var(--muted);
    margin-top: 5px;
}

.actions {
    display: flex;
    gap: 8px;
}

.icon-btn {
    border: none;
    background: var(--panel);
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    cursor: pointer;
}

.mobile-menu {
    display: none;
}

.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 30px;
}

/* WELCOME */

.welcome {
    max-width: 800px;
    margin: 80px auto;
    text-align: center;
}

.welcome-logo {
    width: 90px;
    height: 90px;
    border-radius: 27px;
    margin: 0 auto 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: bold;
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    box-shadow: 0 0 45px rgba(0, 229, 255, .28);
}

.welcome h1 {
    font-size: 34px;
}

.welcome p {
    color: var(--muted);
    margin-top: 13px;
}

.suggestions {
    margin-top: 35px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.suggestions button {
    text-align: left;
    padding: 17px;
    border-radius: 14px;
    background: rgba(16, 23, 43, .75);
    border: 1px solid var(--border);
    color: white;
    cursor: pointer;
}

.suggestions button:hover {
    border-color: var(--cyan);
}

/* MESSAGES */

.message {
    max-width: 850px;
    margin: 0 auto 28px;
    display: flex;
    gap: 14px;
}

.avatar {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.user .avatar {
    background: #26324a;
}

.ai .avatar {
    background: linear-gradient(135deg, var(--cyan), var(--purple));
}

.message-content {
    flex: 1;
    line-height: 1.7;
    white-space: pre-wrap;
}

.message-content pre {
    margin-top: 12px;
    background: #070b16;
    padding: 15px;
    border-radius: 12px;
    overflow-x: auto;
    border: 1px solid var(--border);
}

.copy-btn {
    margin-top: 10px;
    padding: 7px 10px;
    background: var(--panel);
    color: var(--muted);
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

/* INPUT */

.input-section {
    padding: 15px 30px 20px;
}

.input-box {
    max-width: 900px;
    margin: auto;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px;
    border-radius: 18px;
    background: rgba(16, 23, 43, .95);
    border: 1px solid var(--border);
}

textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: white;
    font-size: 15px;
    padding: 10px;
    font-family: inherit;
    max-height: 150px;
}

.input-btn {
    width: 43px;
    height: 43px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    color: white;
    font-size: 17px;
}

.voice-btn {
    background: #1a2338;
}

.send-btn {
    background: linear-gradient(135deg, var(--cyan), var(--purple));
}

.disclaimer {
    text-align: center;
    margin-top: 10px;
    color: var(--muted);
    font-size: 10px;
}

/* MOBILE */

@media (max-width: 800px) {

    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 20;
        transform: translateX(-100%);
        transition: .3s;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .mobile-menu {
        display: block;
        border: none;
        background: none;
        color: white;
        font-size: 23px;
        margin-right: 15px;
        cursor: pointer;
    }

    .topbar {
        padding: 0 15px;
        justify-content: flex-start;
    }

    .actions {
        margin-left: auto;
    }

    .chat-area {
        padding: 18px;
    }

    .input-section {
        padding: 12px;
    }

    .suggestions {
        grid-template-columns: 1fr;
    }

    .welcome {
        margin: 40px auto;
    }

    .welcome h1 {
        font-size: 26px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="logo">V</div>

            <div>
                <h1>VINAY AI</h1>
                <p>FUTURE INTELLIGENCE</p>
            </div>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New Chat
        </button>

        <div class="history" id="history"></div>

        <div class="sidebar-footer">
            <span class="dot"></span>
            VINAY AI ONLINE
        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <button class="mobile-menu" onclick="toggleMenu()">
                ☰
            </button>

            <div>
                <h2 id="chatTitle">New Conversation</h2>
                <p>Powered by VINAY AI</p>
            </div>

            <div class="actions">
                <button class="icon-btn" onclick="renameChat()" title="Rename">
                    ✏️
                </button>

                <button class="icon-btn" onclick="deleteChat()" title="Delete">
                    🗑️
                </button>
            </div>

        </header>


        <!-- CHAT AREA -->

        <div class="chat-area" id="chatArea"></div>


        <!-- INPUT -->

        <div class="input-section">

            <div class="input-box">

                <button
                    class="input-btn voice-btn"
                    onclick="startVoice()"
                    title="Voice Input"
                >
                    🎤
                </button>

                <textarea
                    id="userInput"
                    placeholder="Message VINAY AI..."
                    rows="1"
                ></textarea>

                <button
                    class="input-btn send-btn"
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>

            <p class="disclaimer">
                VINAY AI Demo • Responses are simulated in this HTML version.
            </p>

        </div>

    </main>

</div>


<script>

let chats = JSON.parse(localStorage.getItem("vinay_ai_demo_chats")) || [];
let currentChatId = null;


/* START */

function startApp() {

    if (chats.length === 0) {
        newChat();
    } else {
        currentChatId = chats[0].id;
        renderHistory();
        renderMessages();
    }

}


/* SAVE */

function saveChats() {

    localStorage.setItem(
        "vinay_ai_demo_chats",
        JSON.stringify(chats)
    );

}


/* NEW CHAT */

function newChat() {

    const chat = {
        id: Date.now(),
        title: "New Conversation",
        messages: []
    };

    chats.unshift(chat);

    currentChatId = chat.id;

    saveChats();

    renderHistory();

    renderMessages();

}


/* CURRENT CHAT */

function getCurrentChat() {

    return chats.find(
        chat => chat.id === currentChatId
    );

}


/* HISTORY */

function renderHistory() {

    const history =
        document.getElementById("history");

    history.innerHTML = "";

    chats.forEach(chat => {

        const item =
            document.createElement("div");

        item.className = "history-item";

        if (chat.id === currentChatId) {
            item.classList.add("active");
        }

        item.textContent = chat.title;

        item.onclick = function() {

            currentChatId = chat.id;

            document.getElementById("chatTitle")
                .textContent = chat.title;

            renderHistory();

            renderMessages();

        };

        history.appendChild(item);

    });

}


/* RENDER MESSAGES */

function renderMessages() {

    const area =
        document.getElementById("chatArea");

    const chat =
        getCurrentChat();

    area.innerHTML = "";

    document.getElementById("chatTitle")
        .textContent = chat.title;

    if (chat.messages.length === 0) {

        area.innerHTML = `
        <div class="welcome">

            <div class="welcome-logo">V</div>

            <h1>Hello, I am VINAY AI</h1>

            <p>
                Your futuristic AI assistant.
                Ask me anything.
            </p>

            <div class="suggestions">

                <button onclick="suggest('Help me learn Python programming')">
                    💻 Help me learn Python programming
                </button>

                <button onclick="suggest('Explain artificial intelligence simply')">
                    🧠 Explain artificial intelligence
                </button>

                <button onclick="suggest('Give me a creative website project idea')">
                    ✨ Give me a creative project idea
                </button>

                <button onclick="suggest('Help me write a professional message')">
                    📝 Help me write a message
                </button>

            </div>

        </div>
        `;

        return;
    }

    chat.messages.forEach(message => {

        addMessageToScreen(
            message.text,
            message.role
        );

    });

}


/* ADD MESSAGE */

function addMessageToScreen(text, role) {

    const area =
        document.getElementById("chatArea");

    const message =
        document.createElement("div");

    message.className =
        role === "user"
        ? "message user"
        : "message ai";

    const avatar =
        role === "user"
        ? "YOU"
        : "V";

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    content.textContent = text;

    message.innerHTML = `
        <div class="avatar">${avatar}</div>
    `;

    message.appendChild(content);

    if (role === "ai") {

        const copyButton =
            document.createElement("button");

        copyButton.className =
            "copy-btn";

        copyButton.textContent =
            "📋 Copy";

        copyButton.onclick = function() {

            navigator.clipboard.writeText(text);

            copyButton.textContent =
                "Copied ✓";

        };

        content.appendChild(
            document.createElement("br")
        );

        content.appendChild(copyButton);

    }

    area.appendChild(message);

    area.scrollTop =
        area.scrollHeight;

}


/* SEND MESSAGE */

function sendMessage() {

    const input =
        document.getElementById("userInput");

    const text =
        input.value.trim();

    if (!text) return;

    const chat =
        getCurrentChat();

    if (chat.messages.length === 0) {

        chat.title =
            text.substring(0, 32);

        document.getElementById("chatTitle")
            .textContent = chat.title;

    }

    chat.messages.push({
        role: "user",
        text: text
    });

    input.value = "";

    saveChats();

    renderHistory();

    renderMessages();

    setTimeout(() => {

        const reply =
            generateDemoReply(text);

        chat.messages.push({
            role: "ai",
            text: reply
        });

        saveChats();

        renderMessages();

    }, 700);

}


/* DEMO AI RESPONSES */

function generateDemoReply(message) {

    const text =
        message.toLowerCase();

    if (
        text.includes("hello") ||
        text.includes("hi")
    ) {

        return `Hello! 👋

I am VINAY AI, your futuristic AI assistant.

This is currently a frontend demo version. I can demonstrate conversations, chat history, voice input, and the VINAY AI interface.

How can I help you today?`;

    }

    if (
        text.includes("python")
    ) {

        return `🐍 VINAY AI – Python Learning Mode

Python is a powerful and beginner-friendly programming language.

You can start with:

print("Hello, Vinay!")

Python is commonly used for:

• Artificial Intelligence
• Websites
• Automation
• Data Science
• Apps

In the full VINAY AI version, I can generate real Python programs and explain them step by step.`;

    }

    if (
        text.includes("ai") ||
        text.includes("artificial intelligence")
    ) {

        return `🧠 Artificial Intelligence means creating computer systems that can perform tasks that normally require human intelligence.

Examples include:

• Chatbots
• Image generation
• Voice assistants
• Recommendation systems
• Self-driving technology

VINAY AI can eventually combine many of these features into one platform. 🚀`;

    }

    if (
        text.includes("website") ||
        text.includes("project")
    ) {

        return `✨ VINAY AI Project Idea

Build a Smart Student Dashboard:

• AI Study Assistant
• Notes Generator
• Homework Planner
• PDF Upload
• AI Quiz Generator
• Progress Tracking

You could build the frontend with HTML, CSS and JavaScript, then add Python and AI APIs for the backend.`;

    }

    return `🤖 VINAY AI Demo Response

You said:

"${message}"

In the full version, this message would be sent to a real AI model and VINAY AI would generate an intelligent response based on the complete conversation.

This demo already supports:

✓ Multiple chats
✓ Chat history
✓ Rename chats
✓ Delete chats
✓ Voice input
✓ Mobile design
✓ Local storage

Next step: Connect VINAY AI to a real AI backend. 🚀`;

}


/* SUGGESTIONS */

function suggest(text) {

    document.getElementById("userInput")
        .value = text;

    sendMessage();

}


/* ENTER KEY */

document.getElementById("userInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* RENAME */

function renameChat() {

    const chat =
        getCurrentChat();

    const name =
        prompt(
            "Enter new chat name:",
            chat.title
        );

    if (name && name.trim()) {

        chat.title =
            name.trim();

        saveChats();

        renderHistory();

        renderMessages();

    }

}


/* DELETE */

function deleteChat() {

    if (
        !confirm(
            "Delete this conversation?"
        )
    ) {
        return;
    }

    chats =
        chats.filter(
            chat =>
                chat.id !== currentChatId
        );

    if (chats.length === 0) {

        currentChatId = null;

        saveChats();

        newChat();

    } else {

        currentChatId =
            chats[0].id;

        saveChats();

        renderHistory();

        renderMessages();

    }

}


/* VOICE INPUT */

function startVoice() {

    const SpeechRecognition =

        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "Voice recognition is not supported in this browser."
        );

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-US";

    recognition.start();

    recognition.onresult =
        function(event) {

            const voiceText =
                event.results[0][0].transcript;

            document.getElementById(
                "userInput"
            ).value = voiceText;

        };

}


/* MOBILE MENU */

function toggleMenu() {

    document.getElementById("sidebar")
        .classList.toggle("open");

}


startApp();

</script>

</body>
</html>
